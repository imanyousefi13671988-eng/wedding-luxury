<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت دعوت عروسی فائزه و ایمان</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #ebd8cf;
            background-image: radial-gradient(#f7ebe3 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* --- لایه پاکت نامه و مهر مومی (لوکس) --- */
        .envelope-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fdf8f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 1s ease-in-out;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        }

        .envelope-container.open {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }

        .god-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 26px;
            color: #7d5b54;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .wax-seal-btn {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #d97885, #8a3b47);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 30px rgba(138, 59, 71, 0.45), inset 0 3px 7px rgba(255,255,255,0.4);
            cursor: pointer;
            border: 4px solid #b35261;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .wax-seal-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 35px rgba(138, 59, 71, 0.5);
        }

        .wax-seal-btn span {
            color: #f7e6cc;
            font-family: 'Georgia', serif;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.6);
            border-bottom: 2px solid #f7e6cc;
            padding-bottom: 3px;
        }

        .click-hint {
            margin-top: 20px;
            color: #8a3b47;
            font-size: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- کارت دعوت اصلی --- */
        .card {
            background: #fdf8f5;
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 0;
            box-shadow: 0 20px 45px rgba(110, 70, 60, 0.18);
            border: 1px solid #f0dfd5;
            text-align: center;
            overflow: hidden;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            visibility: hidden;
        }

        .card.show {
            opacity: 1;
            visibility: visible;
        }

        .photo-container {
            width: 100%;
            position: relative;
            margin-bottom: 20px;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .gold-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 10px solid;
            border-image: linear-gradient(to bottom right, #d4af37, #f7e6cc, #d4af37) 1;
            pointer-events: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .card-content {
            padding: 0 25px 30px;
        }

        .names {
            font-size: 34px;
            font-weight: 800;
            color: #73333d;
            margin-bottom: 15px;
        }

        .names span {
            color: #d97885;
            font-size: 26px;
            margin: 0 7px;
        }

        .invitation-text {
            color: #5a4b49;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .info-card {
            background: #f7ebe4;
            padding: 12px 6px;
            border-radius: 16px;
            border: 1px solid #ebd4c8;
        }

        .info-card .icon {
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
        }

        .info-card .title {
            font-size: 12px;
            color: #73333d;
            font-weight: bold;
        }

        .info-card .value {
            font-size: 12px;
            color: #4a3e3c;
            margin-top: 3px;
        }

        .timer-box {
            background: #faf0e8;
            border: 1px dashed #d9b8a8;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .timer-title {
            font-size: 13px;
            color: #8a3b47;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .timer-counts {
            display: flex;
            justify-content: space-around;
        }

        .timer-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-unit .num {
            font-size: 20px;
            font-weight: bold;
            color: #73333d;
        }

        .timer-unit .label {
            font-size: 11px;
            color: #7a6a68;
        }

        .music-box {
            background: #f4e4dc;
            border-radius: 35px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .music-info {
            font-size: 13px;
            color: #614a47;
            font-weight: bold;
        }

        .play-btn {
            background: #8a3b47;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .neshan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #8a3b47;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 6px 18px rgba(138, 59, 71, 0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .neshan-btn:hover {
            background: #6e2d37;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- لایه پاکت نامه و مهر مومی -->
    <div class="envelope-container" id="envelope">
        <div class="god-text">In the name of god</div>
        <div class="wax-seal-btn" onclick="openEnvelope()">
            <span>F | I</span>
        </div>
        <div class="click-hint">جهت بازکردن پاکت کلیک کنید</div>
    </div>

    <!-- کارت اصلی -->
    <div class="card" id="card">
        <div class="photo-container">
            <img src="my-wedding-photo.jpg" alt="عکس عروس و داماد">
            <div class="gold-frame"></div>
        </div>

        <div class="card-content">
            <div class="names">فائزه <span>♡</span> ایمان</div>

            <p class="invitation-text">
                با حضور گرم‌تان در جشن آغاز زندگی مشترک‌مان<br>
                شادی‌مان را کامل کنید...
            </p>

            <div class="info-grid">
                <div class="info-card">
                    <span class="icon">📅</span>
                    <div class="title">تاریخ</div>
                    <div class="value">۲۹ شهریور ۱۴۰۵</div>
                </div>
                <div class="info-card">
                    <span class="icon">⏰</span>
                    <div class="title">ساعت</div>
                    <div class="value">۲۰:۰۰ الی پایان</div>
                </div>
                <div class="info-card">
                    <span class="icon">📍</span>
                    <div class="title">مکان</div>
                    <div class="value">تالار رویال کردکوی</div>
                </div>
            </div>

            <div class="timer-box">
                <div class="timer-title">♡ تا روز شیرین ما ♡</div>
                <div class="timer-counts">
                    <div class="timer-unit"><span class="num" id="days">0</span><span class="label">روز</span></div>
                    <div class="timer-unit"><span class="num" id="hours">0</span><span class="label">ساعت</span></div>
                    <div class="timer-unit"><span class="num" id="minutes">0</span><span class="label">دقیقه</span></div>
                    <div class="timer-unit"><span class="num" id="seconds">0</span><span class="label">ثانیه</span></div>
                </div>
            </div>

            <!-- موزیک پلیر -->
            <div class="music-box">
                <span class="music-info">🎵 موسیقی ما</span>
                <button class="play-btn" id="playBtn" onclick="toggleAudio()">⏸</button>
                <audio id="myAudio" loop>
                    <source src="wedding-song.mp3" type="audio/mpeg">
                </audio>
            </div>

            <a href="https://nshn.ir/" target="_blank" class="neshan-btn">
                📍 مشاهده مسیر در نشان
            </a>
        </div>
    </div>

    <script>
        const audio = document.getElementById("myAudio");
        const playBtn = document.getElementById("playBtn");

        // باز کردن پاکت و پرش از ۴ ثانیه اول برای پخش فوری
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
            document.getElementById('card').classList.add('show');
            document.body.style.overflowY = 'auto';
            
            // پرش از ۴ ثانیه اول و پخش فوری
            audio.currentTime = 4;
            audio.play();
            playBtn.innerText = "⏸";
        }

        // دکمه کنترل دستی موزیک (پخش / توقف)
        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
            }
        }

        // تایمر معکوس
        const weddingDate = new Date("Sep 20, 2026 20:00:00").getTime();

        setInterval(function() {
            const now = new Date().getTime();
            const diff = weddingDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);
    </script>
</body>
</html>
