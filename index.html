<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت دعوت عروسی فائزه و ایمان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- پس‌زمینه اصلی -->
    <div class="bg-overlay"></div>

    <!-- کاور پاکت نامه (انیمیشن باز شدن) -->
    <div class="envelope-wrapper" id="envelope">
        <div class="envelope-top">
            <span class="god-title">In the name of god</span>
        </div>
        <div class="wax-seal" onclick="openEnvelope()">
            <img src="wax-seal-fi.png" alt="Fi Stamp">
        </div>
    </div>

    <!-- کارت دعوت اصلی -->
    <main class="card-container hidden" id="card">
        
        <!-- تصویر زوج -->
        <div class="photo-frame">
            <img src="couple-photo.jpg" alt="فائزه و ایمان">
        </div>

        <!-- اسامی -->
        <h1 class="couple-names">فائزه <span>♡</span> ایمان</h1>

        <p class="invitation-text">
            با حضور گرم‌تان در جشن آغاز زندگی مشترک‌مان<br>
            شادی‌مان را کامل کنید...
        </p>

        <!-- اطلاعات مراسم -->
        <div class="info-boxes">
            <div class="info-item">
                <span class="icon">📅</span>
                <span>۲۹ شهریور ۱۴۰۵</span>
            </div>
            <div class="info-item">
                <span class="icon">⏰</span>
                <span>۲۰:۰۰ تا خاموشی ستارگان</span>
            </div>
            <div class="info-item">
                <span class="icon">📍</span>
                <span>تالار رویال کردکوی</span>
            </div>
        </div>

        <!-- شمارش معکوس -->
        <div class="countdown-section">
            <p>♡ تا روز شیرین ما ♡</p>
            <div class="countdown-timer">
                <div><span id="days">۱۲</span>روز</div>
                <div><span id="hours">۱۵</span>ساعت</div>
                <div><span id="minutes">۴۳</span>دقیقه</div>
                <div><span id="seconds">۲۸</span>ثانیه</div>
            </div>
        </div>

        <!-- موزیک پلیر -->
        <div class="music-player">
            <p>موسیقی ما 🎵</p>
            <audio id="bg-music" src="wedding-song.mp3"></audio>
            <button onclick="toggleMusic()" id="play-btn">▶</button>
        </div>

        <!-- دکمه مسیریابی -->
        <a href="https://neshan.org/..." class="location-btn">
            📍 مشاهده مسیر در نشان
        </a>

    </main>

    <script src="script.js"></script>
</body>
</html>
